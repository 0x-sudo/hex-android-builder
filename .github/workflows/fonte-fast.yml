name: fonte-fast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fonte-fast.yml"
      - "fonte-fast.patch"

permissions:
  contents: write

concurrency:
  group: fonte-fast
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37 platforms;android-36 build-tools;36.0.0"

      - name: Clone Fonte 0.1.15
        run: git clone --depth 1 --branch v0.1.15 https://github.com/Turtlecute33/Fonte.git src

      - name: Apply fast-download patch
        run: git -C src apply "$GITHUB_WORKSPACE/fonte-fast.patch"

      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fonte-${{ hashFiles('src/**/*.gradle*', 'src/**/*.toml', 'src/**/*.properties') }}
          restore-keys: fonte-

      - name: Build debug APK
        working-directory: src
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp src/app/build/outputs/apk/debug/app-debug.apk fonte-fast.apk
          gh release view fonte-fast >/dev/null 2>&1 || \
            gh release create fonte-fast --title "Fonte fast (unofficial debug)" --notes "Fonte 0.1.15: direct Azure origin and 8 parallel range downloads."
          gh release upload fonte-fast fonte-fast.apk --clobber
